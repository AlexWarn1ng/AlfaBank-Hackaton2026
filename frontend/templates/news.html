<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ news.title }} - Альфа Новости</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
    <style>
        .analysis-loading { display: flex; align-items: center; gap: 12px; padding: 24px 0; }
        .analysis-loading[hidden] {display: none;}
        .spinner { width: 22px; height: 22px; border: 3px solid #ddd; border-top-color: #ef3124; border-radius: 50%; animation: spin .8s linear infinite; }
        .analysis-error { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="feed-page">

    <header class="site-header">
        <a class="brand" href="/feed">
            <span class="brand-icon">А</span>
            <span>альфа новости</span>
        </a>

        <div class="header-user">
            <span class="user-name">{{ user.name }}</span>

            <form method="post" action="/logout">
                <button class="button button-outline" type="submit">
                    Выйти
                </button>
            </form>
        </div>
    </header>

    <main class="article-layout">
        <a class="back-link" href="/feed">← К новостям</a>

        <!-- Событие отдельно от его интерпретации -->
        <article class="article-card">
            <h1>{{ news.title }}</h1>
            <p class="article-text">{{ news.text }}</p>
        </article>

        <section class="analysis-section">
            <div class="feed-heading">
                <div><h2>Подробный разбор</h2><p class="muted">{{ role }}</p></div>
            </div>
            <div id="analysis-loading" class="analysis-loading">
                <span class="spinner" aria-hidden="true"></span><span>Готовим анализ новости...</span>
            </div>
            <div id="analysis-content" hidden>
                <div class="analysis-summary">
                    <span class="eyebrow">ГЛАВНОЕ</span>
                    <h3 id="analysis-summary"></h3><p id="analysis-reason"></p>
                </div>
                <div class="analysis-grid">
                    <section class="analysis-block">
                        <h3>Риски</h3>
                        <ul id="analysis-risks" class="analysis-list">
                            <li>Загружаем...</li>
                        </ul>
                    </section>
                    <section class="analysis-block">
                        <h3>Возможности</h3>
                        <ul id="analysis-opportunities" class="analysis-list">
                            <li>Загружаем...</li>
                        </ul>
                    </section>
                </div>
                <section class="analysis-block">
                    <h3>Что можно сделать</h3>
                    <p id="analysis-action"></p>
                </section>
            </div>
            <div id="analysis-error" class="alert analysis-error" role="alert">
                <span id="analysis-error-text"></span>
                <button id="retry-analysis" class="button button-outline" type="button">Повторить</button>
            </div>
        </section>
    </main>
<script>
const loading = document.getElementById("analysis-loading");
const content = document.getElementById("analysis-content");
const errorBox = document.getElementById("analysis-error");
const errorText = document.getElementById("analysis-error-text");
function setList(id, items, emptyText) {
    const list = document.getElementById(id); list.replaceChildren();
    (items.length ? items : [emptyText]).forEach(item => { const li = document.createElement("li"); li.textContent = item; list.appendChild(li); });
}
async function loadAnalysis() {
    loading.hidden = false; content.hidden = true; errorBox.style.display = "none";
    try {
        const response = await fetch("{{ url_for('news_analysis', news_id=news.id) }}", {method: "POST"});
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || "Не удалось выполнить анализ.");
        const analysis = payload.analysis;
        document.getElementById("analysis-summary").textContent = analysis.summary;
        document.getElementById("analysis-reason").textContent = analysis.relevanceReason;
        document.getElementById("analysis-action").textContent = analysis.recommendedAction;
        setList("analysis-risks", analysis.potentialRisks, "Риски не указаны.");
        setList("analysis-opportunities", analysis.potentialOpportunities, "Возможности не указаны.");
        content.hidden = false;
    } catch (error) { errorText.textContent = error.message; errorBox.style.display = "block"; }
    finally { loading.hidden = true; }
}
document.getElementById("retry-analysis").addEventListener("click", loadAnalysis);
loadAnalysis();
</script>
</body>
</html>
