services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres18-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5050:5000"
    environment:
      NEWS_ANALYZER_URL: http://news-analyzer:8080
      COMPANY_SERVICE_URL: http://company-service:8888
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-alfa_insight}
      POSTGRES_USER: ${POSTGRES_USER:-alfa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in .env}
    volumes:
      - frontend-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      company-service:
        condition: service_started
      news-analyzer:
        condition: service_started
    restart: unless-stopped

  news-analyzer:
    build:
      context: ./news-analyzer
      dockerfile: NewsAnalyzer/Dockerfile
    ports:
      - "127.0.0.1:5001:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      COMPANY_SERVICE_URL: http://company-service:8888
      AI_BASE_URL: ${AI_BASE_URL:-https://changellenge.up.railway.app/v1/}
      AI_API_KEY: ${AI_API_KEY:?Set AI_API_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
      company-service:
        condition: service_started
    restart: unless-stopped

  company-service:
    build:
      context: ./company-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-alfa_insight}
      POSTGRES_USER: ${POSTGRES_USER:-alfa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      COMPANY_AI_API_KEY: ${COMPANY_AI_API_KEY:?Set COMPANY_AI_API_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  frontend-data:
  postgres-data:
  postgres18-data:
